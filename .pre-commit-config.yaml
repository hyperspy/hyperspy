default_install_hook_types:
  - pre-commit
  - commit-msg
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.4
    hooks:
      # Run the linter.
      - id: ruff
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Check if switcher.json is valid
      - id: check-json
  - repo: https://github.com/francisco-dlp/.github   # interim; todo 21 flips to hyperspy/.github @ v1.0.0
    rev: b1a6954ab0ba717864d66837ef6946cc0a3a9edd
    hooks:
      - id: check-ai-co-author
      - id: check-agents-policy
        always_run: true
ci:
    # Don't run automatically on PRs, instead add the comment
    # "pre-commit.ci autofix" on a pull request to manually trigger auto-fixing 
    autofix_prs: false
    autoupdate_branch: 'RELEASE_next_patch'
    autoupdate_schedule: monthly
